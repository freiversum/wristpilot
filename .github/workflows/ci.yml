name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install dbus-fast pytest pytest-asyncio Pillow pystray
      - name: Bridge tests
        working-directory: bridge
        run: python -m pytest -q
      - name: Tray tests
        working-directory: windows
        env:
          PYTHONPATH: ../bridge
          PYSTRAY_BACKEND: dummy   # no display on the runner
        run: python -m pytest -q test_tray.py
