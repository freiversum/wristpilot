[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wristpilot-bridge"
version = "0.4.0"
description = "Bridge between a Garmin watch (Connect IQ) and Zwift: GATT peripheral, keyboard output, OpenBikeControl"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
  "dbus-fast>=2.0; sys_platform == 'linux'",
  "bless>=0.2.6; sys_platform == 'darwin'",
  "winrt-runtime>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Devices.Bluetooth>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Devices.Bluetooth.GenericAttributeProfile>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Devices.Enumeration>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
  "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
  "zeroconf>=0.130; sys_platform == 'win32'",
  "bumble>=0.0.236; sys_platform == 'win32'",
]

[project.optional-dependencies]
uinput = ["evdev"]
bumble = ["bumble>=0.0.236"]   # dedicated adapter on Linux (--adapter hci-socket:N or usb:N)
tray = ["pystray", "Pillow"]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
wristpilot-bridge = "wristpilot_bridge.__main__:main"

[tool.setuptools.packages.find]
include = ["wristpilot_bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
